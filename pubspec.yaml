name: hablas_virtual_studio
description: "Hablas Clone — Unlimited Android app cloning & virtualization with Liquid Glass UI"
version: 1.4.0+6
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Permissions
  permission_handler: ^11.3.1

  # App enumeration
  installed_apps: ^1.5.1

  # Storage & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  archive: ^4.0.4

  # Security & Auth
  local_auth: ^3.2.0

  # DI
  get_it: ^8.0.3

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/shaders/
