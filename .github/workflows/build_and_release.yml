name: Hablas Clone Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: List Build Artifacts
        run: ls -la build/app/outputs/flutter-apk/

      - name: Generate Release Notes
        id: release_notes
        run: |
          echo "## Hablas Clone v1.3.0 Release" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 What's New" >> release_notes.md
          echo "- **Hive Persistence**: Cloned instances now survive app restarts!" >> release_notes.md
          echo "- **Icon Persistence**: App icons stored and displayed across restarts" >> release_notes.md
          echo "- **App Cache Service**: Avoids re-scanning device on every picker open" >> release_notes.md
          echo "- **Native Engine + Dart Sync**: Instances merged from Hive and native engine on startup" >> release_notes.md
          echo "- **Real App Launching**: launchVirtualInstance now ACTUALLY launches apps via Intent" >> release_notes.md
          echo "- **Enhanced Permission Gate**: Verifies QUERY_ALL_PACKAGES works by testing app enumeration" >> release_notes.md
          echo "- **Optimistic UI Updates**: Launch/terminate show status change before engine confirms" >> release_notes.md
          echo "- **Retry Support**: Failed actions can be retried from dashboard" >> release_notes.md
          echo "- **Clear Cache**: Action wired to instance action sheet" >> release_notes.md
          echo "- **Clone naming**: WhatsApp Clone 1 instead of generic numbering" >> release_notes.md
          echo "- **Removed duplicate InstanceStatus enum**: Consolidated to domain model" >> release_notes.md
          echo "- **Error banner in dashboard**: Shows retry button when actions fail" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Backend/Logic Improvements" >> release_notes.md
          echo "- InstancePersistenceService: Full Hive CRUD for VirtualInstance" >> release_notes.md
          echo "- AppCacheService: 5-minute TTL cache for discovered apps" >> release_notes.md
          echo "- Native engine: hasLaunchableActivity filter + Intent launch in Kotlin" >> release_notes.md
          echo "- Package validation before creating instances" >> release_notes.md
          echo "- Instance health monitoring with periodic native engine sync" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*Built with Liquid Glass - Powered by Virtual Engine - Crafted with love*" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
