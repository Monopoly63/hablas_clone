name: Hablas Clone Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Prepare Release APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk
          echo "APK built successfully"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: "## Hablas Clone v2.1.0\n\n- App no longer resets on restart\n- Cloned apps persist across restarts\n- Security lock with PIN\n- Progressive lockout on wrong PIN\n- Bulletproof clone flow\n\n*🇦🇪 Zero tracking · Privacy-first*"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
