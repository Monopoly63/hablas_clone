name: Hablas Clone Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (debug mode — proven to work)
        run: flutter build apk --debug

      - name: Rename APK for release pipeline
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk
          APK_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || stat -f%z build/app/outputs/flutter-apk/app-release.apk)
          echo "✅ APK size: $APK_SIZE bytes ($(echo $APK_SIZE | awk '{printf "%.1f", $1/1048576}') MB)"

      - name: Generate Release Notes
        run: |
          echo "## Hablas Clone v2.0.8 🔥" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🔥 CRITICAL FIXES" >> release_notes.md
          echo "- App no longer resets on restart" >> release_notes.md
          echo "- Cloned apps persist across restarts" >> release_notes.md
          echo "- Apps appear on dashboard" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🏗️ Architecture" >> release_notes.md
          echo "- AppStateService — lifecycle state persistence" >> release_notes.md
          echo "- SecurityService — PIN + integrity + anti-tamper" >> release_notes.md
          echo "- AppPickerRepository → Singleton" >> release_notes.md
          echo "- Bulletproof clone flow" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*🇦🇪 Zero tracking · Privacy-first*" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
