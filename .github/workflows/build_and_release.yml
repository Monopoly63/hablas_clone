name: Hablas Clone Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: List Build Artifacts
        run: ls -la build/app/outputs/flutter-apk/

      - name: Generate Release Notes
        id: release_notes
        run: |
          echo "## Hablas Clone v1.4.0 - Production Upgrade" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Major New Features" >> release_notes.md
          echo "- **Work Profile Engine** - REAL app cloning via Android DevicePolicyManager API (like Island/Shelter)" >> release_notes.md
          echo "- **Security Lock** - PIN + Biometric lock screen to protect your clones" >> release_notes.md
          echo "- **Arabic RTL Localization** - Full Arabic language support for Gulf market" >> release_notes.md
          echo "- **Onboarding Wizard** - 4-step professional tutorial for new users" >> release_notes.md
          echo "- **Stealth Mode** - Hide app from launcher, open via dialer code" >> release_notes.md
          echo "- **Data Export/Import** - Backup and restore clone data as ZIP" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Architecture Improvements" >> release_notes.md
          echo "- **Result Type** - Type-safe success/error handling (Rust-style Result<T>)" >> release_notes.md
          echo "- **AppError hierarchy** - Structured errors with Arabic/English messages, retryable flags" >> release_notes.md
          echo "- **GetIt DI** - Proper dependency injection container (no ad-hoc instances)" >> release_notes.md
          echo "- **LocalizationService** - JSON-based ar/en localization with auto-detection" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Privacy Promise" >> release_notes.md
          echo "- Zero tracking, zero ads, zero data harvesting" >> release_notes.md
          echo "- Your clone data stays on YOUR device" >> release_notes.md
          echo "- Optional security lock for added protection" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*Built with Liquid Glass - Powered by Virtual Engine - Crafted with love*" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
